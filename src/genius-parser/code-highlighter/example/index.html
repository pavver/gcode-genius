<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-code Syntax Highlighting Demo v2.1 - Fixed</title>
  <link href='https://fonts.googleapis.com/css?family=Cascadia+Code' rel='stylesheet'>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="container">
    <h1>🎨 G-code Genius Syntax Highlighting Quick-test</h1>
    <div class="controls">
      <div class="control-group">
        <label>Background Color:</label>
        <input type="color" id="bgColorPicker" value="#1e1e1e">
        <input type="text" id="bgColorText" value="#1e1e1e" placeholder="#1e1e1e">
      </div>
      <div class="control-group">
        <label>Themes:</label>
        <div class="preset-buttons">
          <button class="preset-btn" onclick="applyBackground('#1e1e1e')"
            style="background-color: #1e1e1e; color: white;">Dark</button>
          <button class="preset-btn" onclick="applyBackground('#1f1f1f')"
            style="background-color: #1f1f1f; color: white;">Dark Modern</button>
          <button class="preset-btn" onclick="applyBackground('#ffffff')"
            style="background-color: #ffffff; color: black; border: 1px solid #ddd;">Light</button>
          <button class="preset-btn" onclick="applyBackground('#000000')"
            style="background-color: #000000; color: white;">High Contrast</button>
          <button class="preset-btn" onclick="applyBackground('#272822')"
            style="background-color: #272822; color: white;">Monokai</button>
          <button class="preset-btn" onclick="applyBackground('#fdf6e3')"
            style="background-color: #fdf6e3; color: black; border: 1px solid #ddd;">Solarized Light</button>
          <button class="preset-btn" onclick="applyBackground('#002b36')"
            style="background-color: #002b36; color: white;">Solarized Dark</button>
          <button class="preset-btn" onclick="applyBackground('#390000')"
            style="background-color: #390000; color: white;">Red</button>
          <button class="preset-btn" onclick="applyBackground('#f5f5f5')"
            style="background-color: #f5f5f5; color: black; border: 1px solid #ddd;">Quiet Light</button>
          <button class="preset-btn" onclick="applyBackground('#000c18')"
            style="background-color: #000c18; color: white;">Abyss</button>
          <button class="preset-btn" onclick="applyBackground('#221a0f')"
            style="background-color: #221a0f; color: white;">Kimbie Dark</button>
          <button class="preset-btn" onclick="applyBackground('#002451')"
            style="background-color: #002451; color: white;">Tomorrow Night Blue</button>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="editor-panel">
        <div class="editor-header">
          <h2>G-code Editor</h2>
          <button id="toggleModeBtn" class="preset-btn">Edit</button>
          <div class="stats">
            <span id="statsText">Contrast: -</span>
          </div>
        </div>
        <textarea id="gcodeTextarea" class="gcode-editor"
          style="display: none; width: 100%; min-height: 600px; resize: vertical; border: 1px solid #333; background-color: #1e1e1e; color: #e0e0e0;"></textarea>
        <div class="gcode-editor" id="gcodeEditor"></div>
      </div>

      <div class="legend-panel">
        <h2>Category Legend</h2>
        <div id="legendContainer"></div>
      </div>
    </div>
  </div>

  <script src="../src/index.js"></script>

  <!-- JavaScript modules - load in correct order -->
  <script src="js/config.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
