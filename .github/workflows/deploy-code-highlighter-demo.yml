
name: Deploy code-highlighter Demo to GitHub Pages

on:
  push:
    branches:
      - master # Або 'main'
    paths:
      - 'src/genius-parser/code-highlighter/example/**'
      - 'src/genius-parser/code-highlighter/src/index.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare build directory
        run: |
          mkdir -p ./_site/src
          cp -r src/genius-parser/code-highlighter/example/* ./_site/
          cp src/genius-parser/code-highlighter/src/index.js ./_site/src/
      
      - name: Fix script path in index.html
        run: sed -i 's|../src/index.js|src/index.js|g' ./_site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
